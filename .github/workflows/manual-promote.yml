name: Manual Dist Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.2.3)
        required: true
      ios_asset_url:
        description: iOS XCFramework zip URL
        required: false
      ios_checksum_sha256:
        description: iOS SwiftPM checksum
        required: false
      android_asset_url:
        description: Android AAR/zip URL
        required: false
      android_checksum_sha256:
        description: Android SHA256 checksum
        required: false
      android_maven_repository_url:
        description: Android Maven repository URL (optional)
        required: false
      android_maven_group_id:
        description: Android Maven groupId (optional)
        required: false
      android_maven_artifact_id:
        description: Android Maven artifactId (optional)
        required: false
      android_maven_version:
        description: Android Maven version (optional)
        required: false
      android_maven_packaging:
        description: Android Maven packaging (optional, default aar)
        required: false
      android_maven_pom_url:
        description: Android Maven POM URL (optional)
        required: false
      cordova_asset_url:
        description: Cordova package URL
        required: false
      cordova_checksum_sha256:
        description: Cordova SHA256 checksum
        required: false
      stamp_spm:
        description: >-
          Re-stamp every binaryTarget in Package.swift from the assets published
          on this release tag (checksums recomputed from the bytes actually
          served). Leave on to repair a split manifest; this needs no asset URL
          inputs.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dist-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply provided platform metadata
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          ANDROID_MAVEN_METADATA_JSON=""
          if [[ -n "${android_maven_repository_url:-}" || -n "${android_maven_group_id:-}" || -n "${android_maven_artifact_id:-}" || -n "${android_maven_version:-}" || -n "${android_maven_pom_url:-}" ]]; then
            test -n "${android_maven_repository_url:-}"
            test -n "${android_maven_group_id:-}"
            test -n "${android_maven_artifact_id:-}"
            test -n "${android_maven_version:-}"
            ANDROID_MAVEN_METADATA_JSON=$(jq -nc \
              --arg repository_url "${android_maven_repository_url}" \
              --arg group_id "${android_maven_group_id}" \
              --arg artifact_id "${android_maven_artifact_id}" \
              --arg version "${android_maven_version}" \
              --arg packaging "${android_maven_packaging:-aar}" \
              --arg pom_url "${android_maven_pom_url:-}" \
              '{
                maven: (
                  {
                    repository_url: $repository_url,
                    group_id: $group_id,
                    artifact_id: $artifact_id,
                    version: $version,
                    packaging: $packaging
                  }
                  + (if $pom_url != "" then {pom_url: $pom_url} else {} end)
                )
              }')
          fi
          for P in ios android cordova; do
            URL_VAR="${P}_asset_url"
            CS_VAR="${P}_checksum_sha256"
            URL="${!URL_VAR:-}"
            CS="${!CS_VAR:-}"
            if [ -n "$URL" ] && [ -n "$CS" ]; then
              if [[ "$P" == "android" && -n "$ANDROID_MAVEN_METADATA_JSON" ]]; then
                python3 scripts/merge_release_state.py manifests/release-state "$VERSION" "$P" "$URL" "$CS" "$ANDROID_MAVEN_METADATA_JSON"
              else
                python3 scripts/merge_release_state.py manifests/release-state "$VERSION" "$P" "$URL" "$CS"
              fi
            fi
          done
        env:
          ios_asset_url: ${{ inputs.ios_asset_url }}
          ios_checksum_sha256: ${{ inputs.ios_checksum_sha256 }}
          android_asset_url: ${{ inputs.android_asset_url }}
          android_checksum_sha256: ${{ inputs.android_checksum_sha256 }}
          android_maven_repository_url: ${{ inputs.android_maven_repository_url }}
          android_maven_group_id: ${{ inputs.android_maven_group_id }}
          android_maven_artifact_id: ${{ inputs.android_maven_artifact_id }}
          android_maven_version: ${{ inputs.android_maven_version }}
          android_maven_packaging: ${{ inputs.android_maven_packaging }}
          android_maven_pom_url: ${{ inputs.android_maven_pom_url }}
          cordova_asset_url: ${{ inputs.cordova_asset_url }}
          cordova_checksum_sha256: ${{ inputs.cordova_checksum_sha256 }}

      # Draft, for the same reason as dist-release.yml: a published release
      # needs a tag, and creating it here would tag the pre-stamp commit.
      - name: Ensure draft dist release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$VERSION" --draft \
            --title "Release $VERSION" \
            --notes "Release in progress (manual promote)."

      - name: Download and re-upload assets to dist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_REPO_PAT: ${{ secrets.DIST_REPO_PAT }}
          ios_asset_url: ${{ inputs.ios_asset_url }}
          android_asset_url: ${{ inputs.android_asset_url }}
          cordova_asset_url: ${{ inputs.cordova_asset_url }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          mkdir -p incoming
          for P in ios android cordova; do
            URL_VAR="${P}_asset_url"
            URL="${!URL_VAR:-}"
            if [ -z "$URL" ]; then continue; fi
            ASSET_NAME=$(basename "$URL")
            DOWNLOAD_TOKEN="${DIST_REPO_PAT:-$GH_TOKEN}"
            SOURCE_PATH="${URL#https://github.com/}"
            SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d/ -f1-2)"
            SOURCE_TAG="$(echo "$SOURCE_PATH" | cut -d/ -f5)"
            if [[ -n "$SOURCE_REPO" && -n "$SOURCE_TAG" ]]; then
              rm -f "incoming/${ASSET_NAME}"
              GH_TOKEN="$DOWNLOAD_TOKEN" gh release download "$SOURCE_TAG" \
                --repo "$SOURCE_REPO" \
                --pattern "$ASSET_NAME" \
                --dir incoming || { echo "Warning: could not download $ASSET_NAME from $SOURCE_REPO"; continue; }
              if [ -f "incoming/${ASSET_NAME}" ]; then
                gh release upload "$VERSION" "incoming/${ASSET_NAME}" --clobber
              fi
            fi
          done

      # MOVED AHEAD OF THE STAMP/COMMIT, as in dist-release.yml: the gate
      # has to run before the thing it gates.
      - name: Check release readiness
        id: ready
        run: |
          set +e
          python3 scripts/validate_release_ready.py "manifests/release-state/${{ inputs.version }}.json"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update platform manifests
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"

          ANDROID_MAVEN_METADATA_JSON=""
          if [[ -n "${android_maven_repository_url:-}" && -n "${android_maven_group_id:-}" && -n "${android_maven_artifact_id:-}" && -n "${android_maven_version:-}" ]]; then
            ANDROID_MAVEN_METADATA_JSON=$(jq -nc \
              --arg repository_url "${android_maven_repository_url}" \
              --arg group_id "${android_maven_group_id}" \
              --arg artifact_id "${android_maven_artifact_id}" \
              --arg version "${android_maven_version}" \
              --arg packaging "${android_maven_packaging:-aar}" \
              --arg pom_url "${android_maven_pom_url:-}" \
              '{
                maven: (
                  {repository_url: $repository_url, group_id: $group_id, artifact_id: $artifact_id, version: $version, packaging: $packaging}
                  + (if $pom_url != "" then {pom_url: $pom_url} else {} end)
                )
              }')
          fi

          # Same monotonic, line-aware stamper the release train uses. This
          # step used to carry its own copy of the unconditional
          # `latest["version"] = VERSION` heredoc, so the recovery tool could
          # reintroduce the downgrade it was being used to repair.
          for P in ios android cordova; do
            URL_VAR="${P}_asset_url"
            CS_VAR="${P}_checksum_sha256"
            URL="${!URL_VAR:-}"
            CS="${!CS_VAR:-}"
            if [ -z "$URL" ] || [ -z "$CS" ]; then continue; fi
            ASSET_NAME=$(basename "$URL")
            DIST_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ASSET_NAME}"
            MAVEN_JSON=""
            if [[ "$P" == "android" ]]; then MAVEN_JSON="$ANDROID_MAVEN_METADATA_JSON"; fi
            python3 scripts/update_platform_manifest.py "manifests/${P}.json" \
              --version "$VERSION" \
              --asset-url "$DIST_URL" \
              --asset-name "$ASSET_NAME" \
              --checksum "$CS" \
              --maven-json "$MAVEN_JSON"
          done
        env:
          ios_asset_url: ${{ inputs.ios_asset_url }}
          ios_checksum_sha256: ${{ inputs.ios_checksum_sha256 }}
          android_asset_url: ${{ inputs.android_asset_url }}
          android_checksum_sha256: ${{ inputs.android_checksum_sha256 }}
          android_maven_repository_url: ${{ inputs.android_maven_repository_url }}
          android_maven_group_id: ${{ inputs.android_maven_group_id }}
          android_maven_artifact_id: ${{ inputs.android_maven_artifact_id }}
          android_maven_version: ${{ inputs.android_maven_version }}
          android_maven_packaging: ${{ inputs.android_maven_packaging }}
          android_maven_pom_url: ${{ inputs.android_maven_pom_url }}
          cordova_asset_url: ${{ inputs.cordova_asset_url }}
          cordova_checksum_sha256: ${{ inputs.cordova_checksum_sha256 }}

      # THE defect this tool was carrying: it called update_spm_manifest.py with
      # two positional args, which hit the legacy branch that stamped
      # NeurolabsSDK and nothing else — leaving the other six binaryTargets on
      # whatever tag they happened to be on. The tool an engineer reaches for to
      # repair a split manifest produced a worse one. The legacy branch is gone;
      # this now re-derives EVERY binaryTarget's URL and checksum from the
      # assets published on the tag, by downloading and hashing them, and fails
      # if the release is missing an asset for any declared target.
      - name: Re-stamp Package.swift from the release assets
        if: inputs.stamp_spm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/update_spm_manifest.py Package.swift \
            --release-tag "${{ inputs.version }}" \
            --from-release "${{ github.repository }}"

      - name: Assert Package.swift serves one release line
        if: inputs.stamp_spm
        run: |
          set -euo pipefail
          python3 scripts/verify_spm_manifest.py Package.swift \
            --expect-tag "${{ inputs.version }}"

      - name: Commit manifest changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift manifests/*.json manifests/release-state/*.json
          git commit -m "chore(dist): manual promote for ${{ inputs.version }}" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push

      - name: Checkout Cordova SDK repo
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-cordova-sdk
          path: external/neurolabs-cordova-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Checkout Android SDK repo
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-android-sdk
          path: external/neurolabs-android-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Checkout iOS SDK repo
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-ios-sdk
          path: external/neurolabs-ios-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Refresh integration guides
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 scripts/sync_integration_guides.py \
            --dist-root . \
            --workspace-root ./external \
            --version "${{ inputs.version }}"

      - name: Commit refreshed guides
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/integration-guides manifests/guides.json
          git commit -m "docs(dist): refresh integration guides for ${{ inputs.version }}" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push

      - name: Update release notes
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          STATE_FILE="manifests/release-state/${VERSION}.json"
          IOS_URL=$(jq -r '.artifacts.ios.asset_url // "N/A"' "$STATE_FILE")
          ANDROID_URL=$(jq -r '.artifacts.android.asset_url // "N/A"' "$STATE_FILE")
          CORDOVA_URL=$(jq -r '.artifacts.cordova.asset_url // "N/A"' "$STATE_FILE")
          ANDROID_MAVEN_NOTE=""
          ANDROID_MAVEN_REPO=$(jq -r '.artifacts.android.maven.repository_url // empty' "$STATE_FILE")
          ANDROID_MAVEN_GROUP=$(jq -r '.artifacts.android.maven.group_id // empty' "$STATE_FILE")
          ANDROID_MAVEN_ARTIFACT=$(jq -r '.artifacts.android.maven.artifact_id // empty' "$STATE_FILE")
          ANDROID_MAVEN_VERSION=$(jq -r '.artifacts.android.maven.version // empty' "$STATE_FILE")
          if [[ -n "$ANDROID_MAVEN_REPO" && -n "$ANDROID_MAVEN_GROUP" && -n "$ANDROID_MAVEN_ARTIFACT" && -n "$ANDROID_MAVEN_VERSION" ]]; then
            ANDROID_MAVEN_NOTE=$(
              printf '%s\n%s\n%s' \
                '**Android Gradle (Maven):**' \
                "- Repository: \`${ANDROID_MAVEN_REPO}\`" \
                "- Dependency: \`${ANDROID_MAVEN_GROUP}:${ANDROID_MAVEN_ARTIFACT}:${ANDROID_MAVEN_VERSION}\`"
            )
          fi
          {
            printf '## Release %s\n\n' "$VERSION"
            printf '### Assets\n'
            printf '| Platform | URL |\n'
            printf '|----------|-----|\n'
            printf '| iOS XCFramework | %s |\n' "$IOS_URL"
            printf '| Android SDK | %s |\n' "$ANDROID_URL"
            printf '| Cordova plugin | %s |\n\n' "$CORDOVA_URL"
            printf '### Integration\n'
            printf -- '- **iOS SwiftPM:** add this repo and select `NeurolabsSDK`\n'
            printf -- '- **Android/Cordova:** use the assets and manifests in this release\n'
            if [[ -n "$ANDROID_MAVEN_NOTE" ]]; then
              printf '%s\n' "$ANDROID_MAVEN_NOTE"
            fi
          } > release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md

      # Same single-shot tagging as dist-release.yml. A recovery run that did
      # not reach a complete, validated release leaves the draft alone: no tag,
      # nothing published, nothing force-moved.
      - name: Tag and publish the release
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          HEAD_SHA="$(git rev-parse HEAD)"
          if EXISTING="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}")"; then
            if [[ "$EXISTING" != "$HEAD_SHA" ]]; then
              echo "::error::Tag ${VERSION} already exists at ${EXISTING} but the finished" >&2
              echo "manifest is at ${HEAD_SHA}. Refusing to force-move a published tag." >&2
              echo "Delete the tag deliberately, or cut a new patch version." >&2
              exit 1
            fi
          else
            git tag -a "$VERSION" -m "Coordinated mobile distribution release $VERSION"
            git push origin "refs/tags/${VERSION}"
          fi
          IS_LATEST=$(VERSION="$VERSION" python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import semver
          version = os.environ["VERSION"]
          known = []
          for name in ("ios", "android", "cordova"):
              data = json.loads(open(f"manifests/{name}.json").read())
              entries = list((data.get("lines") or {}).values()) + [data.get("latest") or {}]
              known += [e["version"] for e in entries if e.get("version")]
          print("true" if all(semver.compare(version, k) >= 0 for k in known) else "false")
          PY
          )
          gh release edit "$VERSION" --draft=false --latest="$IS_LATEST"
          echo "published $VERSION (latest=$IS_LATEST)"
