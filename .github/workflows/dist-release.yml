name: Dist Release Orchestrator

on:
  repository_dispatch:
    types:
      - ios_ready
      - android_ready
      - cordova_ready

permissions:
  contents: write

concurrency:
  group: dist-release-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  update-release-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          echo "$CLIENT_PAYLOAD" > payload.json
          VERSION=$(jq -r '.version' payload.json)
          PLATFORM=$(jq -r '.platform' payload.json)
          SOURCE_ASSET_URL=$(jq -r '.asset_url' payload.json)
          CHECKSUM=$(jq -r '.checksum_sha256' payload.json)
          ASSET_NAME=$(jq -r '.asset_name // empty' payload.json)
          # Optional second iOS product — ProductAuditKit ships as its own asset.
          PAK_ASSET_NAME=$(jq -r '.productauditkit.asset_name // empty' payload.json)
          PAK_ASSET_URL=$(jq -r '.productauditkit.asset_url // empty' payload.json)
          PAK_CHECKSUM=$(jq -r '.productauditkit.checksum_sha256 // empty' payload.json)
          # Optional recognition binary stack (iOS v1.7.x): five more assets,
          # each name+checksum; URLs derive from the main asset's release.
          # NESTED under one `recognition` key: repository_dispatch caps
          # client_payload at 10 TOP-LEVEL properties, and v1.7.2's flat
          # form hit 11 when RecognitionBootstrap joined (the v1.7.2
          # dispatch failed on exactly that). Legacy flat keys accepted as
          # fallback for replays of older payloads.
          RI_ASSET=$(jq -r '.recognition.interface.asset_name // .recognitioninterface.asset_name // empty' payload.json)
          RI_CHECKSUM=$(jq -r '.recognition.interface.checksum_sha256 // .recognitioninterface.checksum_sha256 // empty' payload.json)
          RE_ASSET=$(jq -r '.recognition.engine.asset_name // .recognitionengine.asset_name // empty' payload.json)
          RE_CHECKSUM=$(jq -r '.recognition.engine.checksum_sha256 // .recognitionengine.checksum_sha256 // empty' payload.json)
          RQ_ASSET=$(jq -r '.recognition.engineqdrant.asset_name // .recognitionengineqdrant.asset_name // empty' payload.json)
          RQ_CHECKSUM=$(jq -r '.recognition.engineqdrant.checksum_sha256 // .recognitionengineqdrant.checksum_sha256 // empty' payload.json)
          FFI_ASSET=$(jq -r '.recognition.nlqdrantedgeffi.asset_name // .nlqdrantedgeffi.asset_name // empty' payload.json)
          FFI_CHECKSUM=$(jq -r '.recognition.nlqdrantedgeffi.checksum_sha256 // .nlqdrantedgeffi.checksum_sha256 // empty' payload.json)
          RB_ASSET=$(jq -r '.recognition.bootstrap.asset_name // .recognitionbootstrap.asset_name // empty' payload.json)
          RB_CHECKSUM=$(jq -r '.recognition.bootstrap.checksum_sha256 // .recognitionbootstrap.checksum_sha256 // empty' payload.json)
          MAVEN_REPOSITORY_URL=$(jq -r '.maven.repository_url // .maven_repository_url // empty' payload.json)
          MAVEN_GROUP_ID=$(jq -r '.maven.group_id // .maven_group_id // empty' payload.json)
          MAVEN_ARTIFACT_ID=$(jq -r '.maven.artifact_id // .maven_artifact_id // empty' payload.json)
          MAVEN_VERSION=$(jq -r '.maven.version // .maven_version // empty' payload.json)
          MAVEN_PACKAGING=$(jq -r '.maven.packaging // .maven_packaging // "aar"' payload.json)
          MAVEN_POM_URL=$(jq -r '.maven.pom_url // .maven_pom_url // empty' payload.json)

          test -n "$VERSION" && test "$VERSION" != "null"
          test -n "$PLATFORM" && test "$PLATFORM" != "null"
          test -n "$SOURCE_ASSET_URL" && test "$SOURCE_ASSET_URL" != "null"
          test -n "$CHECKSUM" && test "$CHECKSUM" != "null"
          test -n "$ASSET_NAME" && test "$ASSET_NAME" != "null"

          # An iOS dispatch must carry EVERY binaryTarget Package.swift
          # declares. It used to be allowed to carry a subset, and the stamp
          # step below quietly stamped only what arrived — which is how a
          # 1.6.x backport (no `recognition` key) left five recognition
          # targets pinned to 1.7.7 while moving the other two to 1.6.12, and
          # shipped a Package.swift serving two release lines at once.
          # Fail here, before a single asset is uploaded, rather than there.
          if [[ "$PLATFORM" == "ios" ]]; then
            MISSING=()
            [[ -n "$PAK_ASSET_NAME" ]] || MISSING+=("productauditkit")
            [[ -n "$RI_ASSET" ]] || MISSING+=("recognition.interface")
            [[ -n "$RE_ASSET" ]] || MISSING+=("recognition.engine")
            [[ -n "$RQ_ASSET" ]] || MISSING+=("recognition.engineqdrant")
            [[ -n "$FFI_ASSET" ]] || MISSING+=("recognition.nlqdrantedgeffi")
            [[ -n "$RB_ASSET" ]] || MISSING+=("recognition.bootstrap")
            if (( ${#MISSING[@]} > 0 )); then
              echo "::error::iOS dispatch for $VERSION is missing assets for: ${MISSING[*]}" >&2
              echo "Package.swift on main declares 7 binaryTargets and a release must stamp all of them." >&2
              echo "A source tree without the recognition targets (the 1.6.x line) cannot be described by" >&2
              echo "this manifest — it needs its own release/1.6 branch with its own Package.swift, not a" >&2
              echo "partial stamp of this one. See README 'Release lines'." >&2
              exit 1
            fi
          fi

          HAS_ANDROID_MAVEN=false
          if [[ "$PLATFORM" == "android" ]]; then
            if [[ -n "$MAVEN_REPOSITORY_URL" || -n "$MAVEN_GROUP_ID" || -n "$MAVEN_ARTIFACT_ID" || -n "$MAVEN_VERSION" || -n "$MAVEN_POM_URL" ]]; then
              test -n "$MAVEN_REPOSITORY_URL"
              test -n "$MAVEN_GROUP_ID"
              test -n "$MAVEN_ARTIFACT_ID"
              test -n "$MAVEN_VERSION"
              HAS_ANDROID_MAVEN=true
            fi
          fi

          ANDROID_MAVEN_METADATA_JSON=""
          if [[ "$HAS_ANDROID_MAVEN" == "true" ]]; then
            ANDROID_MAVEN_METADATA_JSON=$(jq -nc \
              --arg repository_url "$MAVEN_REPOSITORY_URL" \
              --arg group_id "$MAVEN_GROUP_ID" \
              --arg artifact_id "$MAVEN_ARTIFACT_ID" \
              --arg version "$MAVEN_VERSION" \
              --arg packaging "$MAVEN_PACKAGING" \
              --arg pom_url "$MAVEN_POM_URL" \
              '{
                maven: (
                  {
                    repository_url: $repository_url,
                    group_id: $group_id,
                    artifact_id: $artifact_id,
                    version: $version,
                    packaging: $packaging
                  }
                  + (if $pom_url != "" then {pom_url: $pom_url} else {} end)
                )
              }')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "source_asset_url=$SOURCE_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "pak_asset_name=$PAK_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "pak_asset_url=$PAK_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "pak_checksum=$PAK_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "ri_asset=$RI_ASSET" >> "$GITHUB_OUTPUT"
          echo "ri_checksum=$RI_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "re_asset=$RE_ASSET" >> "$GITHUB_OUTPUT"
          echo "re_checksum=$RE_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "rq_asset=$RQ_ASSET" >> "$GITHUB_OUTPUT"
          echo "rq_checksum=$RQ_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "ffi_asset=$FFI_ASSET" >> "$GITHUB_OUTPUT"
          echo "ffi_checksum=$FFI_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "rb_asset=$RB_ASSET" >> "$GITHUB_OUTPUT"
          echo "rb_checksum=$RB_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "has_android_maven=$HAS_ANDROID_MAVEN" >> "$GITHUB_OUTPUT"
          {
            echo "android_maven_metadata_json<<EOF"
            echo "$ANDROID_MAVEN_METADATA_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Created as a DRAFT on purpose. A published release needs a git tag, and
      # `gh release create` tags whatever HEAD is at the time — i.e. the commit
      # BEFORE the manifest stamp. That is why this job used to finish with
      # `git tag -f` + `git push -f`, force-moving a tag partners may already
      # have resolved. A draft carries no tag, so the tag can be created once,
      # at the end, on the commit that actually contains the stamped manifest.
      - name: Ensure draft dist release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.payload.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$VERSION" --draft \
            --title "Release $VERSION" \
            --notes "Release in progress. Artifacts are being synchronized."

      - name: Download source artifact and verify checksum
        id: sync_asset
        env:
          DIST_REPO_PAT: ${{ secrets.DIST_REPO_PAT }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          ASSET_NAME="${{ steps.payload.outputs.asset_name }}"
          SRC_URL="${{ steps.payload.outputs.source_asset_url }}"
          DEST="incoming/${ASSET_NAME}"
          DOWNLOAD_TOKEN="${DIST_REPO_PAT:-}"

          if [[ -z "${DOWNLOAD_TOKEN:-}" ]]; then
            echo "Error: DIST_REPO_PAT secret is required to download source artifacts" >&2
            exit 1
          fi

          SOURCE_PATH="${SRC_URL#https://github.com/}"
          SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d/ -f1-2)"
          SOURCE_TAG="$(echo "$SOURCE_PATH" | cut -d/ -f5)"

          if [[ -z "$SOURCE_REPO" || -z "$SOURCE_TAG" ]]; then
            echo "Unable to parse source repo/tag from asset URL: $SRC_URL" >&2
            exit 1
          fi

          rm -f "$DEST"
          GH_TOKEN="$DOWNLOAD_TOKEN" gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern "$ASSET_NAME" \
            --dir incoming

          ACTUAL=$(sha256sum "$DEST" | awk '{print $1}')
          EXPECTED="${{ steps.payload.outputs.checksum }}"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Checksum mismatch for $ASSET_NAME" >&2
            echo "expected=$EXPECTED" >&2
            echo "actual=$ACTUAL" >&2
            exit 1
          fi

          echo "local_path=$DEST" >> "$GITHUB_OUTPUT"
          DIST_ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.payload.outputs.version }}/${ASSET_NAME}"
          echo "dist_asset_url=$DIST_ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to dist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.payload.outputs.version }}" "${{ steps.sync_asset.outputs.local_path }}" --clobber

      - name: Sync ProductAuditKit asset (iOS)
        id: sync_pak
        if: steps.payload.outputs.platform == 'ios'
        env:
          DIST_REPO_PAT: ${{ secrets.DIST_REPO_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAK_NAME="${{ steps.payload.outputs.pak_asset_name }}"
          PAK_URL="${{ steps.payload.outputs.pak_asset_url }}"
          PAK_CS="${{ steps.payload.outputs.pak_checksum }}"
          mkdir -p incoming
          DEST="incoming/${PAK_NAME}"
          SOURCE_PATH="${PAK_URL#https://github.com/}"
          SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d/ -f1-2)"
          SOURCE_TAG="$(echo "$SOURCE_PATH" | cut -d/ -f5)"
          rm -f "$DEST"
          GH_TOKEN="${DIST_REPO_PAT}" gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" --pattern "$PAK_NAME" --dir incoming
          ACTUAL=$(sha256sum "$DEST" | awk '{print $1}')
          if [[ "$ACTUAL" != "$PAK_CS" ]]; then
            echo "ProductAuditKit checksum mismatch: expected=$PAK_CS actual=$ACTUAL" >&2
            exit 1
          fi
          gh release upload "${{ steps.payload.outputs.version }}" "$DEST" --clobber
          DIST_PAK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.payload.outputs.version }}/${PAK_NAME}"
          echo "dist_pak_url=$DIST_PAK_URL" >> "$GITHUB_OUTPUT"

      - name: Sync recognition assets (iOS)
        id: sync_recognition
        if: steps.payload.outputs.platform == 'ios'
        env:
          DIST_REPO_PAT: ${{ secrets.DIST_REPO_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same source release as the main asset.
          SOURCE_PATH="${{ steps.payload.outputs.source_asset_url }}"
          SOURCE_PATH="${SOURCE_PATH#https://github.com/}"
          SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d/ -f1-2)"
          SOURCE_TAG="$(echo "$SOURCE_PATH" | cut -d/ -f5)"
          mkdir -p incoming
          sync_one() {
            local NAME="$1" CS="$2" KEY="$3"
            local DEST="incoming/${NAME}"
            rm -f "$DEST"
            GH_TOKEN="${DIST_REPO_PAT}" gh release download "$SOURCE_TAG" \
              --repo "$SOURCE_REPO" --pattern "$NAME" --dir incoming
            local ACTUAL
            ACTUAL=$(sha256sum "$DEST" | awk '{print $1}')
            if [[ "$ACTUAL" != "$CS" ]]; then
              echo "${NAME} checksum mismatch: expected=$CS actual=$ACTUAL" >&2
              exit 1
            fi
            gh release upload "${{ steps.payload.outputs.version }}" "$DEST" --clobber
            echo "${KEY}_url=https://github.com/${{ github.repository }}/releases/download/${{ steps.payload.outputs.version }}/${NAME}" >> "$GITHUB_OUTPUT"
          }
          sync_one "${{ steps.payload.outputs.ri_asset }}" "${{ steps.payload.outputs.ri_checksum }}" ri
          sync_one "${{ steps.payload.outputs.re_asset }}" "${{ steps.payload.outputs.re_checksum }}" re
          sync_one "${{ steps.payload.outputs.rq_asset }}" "${{ steps.payload.outputs.rq_checksum }}" rq
          sync_one "${{ steps.payload.outputs.ffi_asset }}" "${{ steps.payload.outputs.ffi_checksum }}" ffi
          # No longer optional: the payload gate above rejects a dispatch
          # without it, because Package.swift declares the target and a
          # missing asset means a stale pin, not an absent product.
          sync_one "${{ steps.payload.outputs.rb_asset }}" "${{ steps.payload.outputs.rb_checksum }}" rb

      # release-state is the only thing that outlives a dispatch, so everything
      # a later run needs to stamp THIS platform has to land in it here. For
      # android that has always been the `maven` block; iOS now adds the
      # per-binaryTarget URL/checksum map, because Package.swift is no longer
      # stamped on the iOS dispatch — it is stamped on whichever dispatch
      # completes the release, and that is usually not iOS.
      - name: Merge version state
        env:
          ANDROID_MAVEN_METADATA_JSON: ${{ steps.payload.outputs.android_maven_metadata_json }}
          PLATFORM: ${{ steps.payload.outputs.platform }}
          SDK_URL: ${{ steps.sync_asset.outputs.dist_asset_url }}
          SDK_CHECKSUM: ${{ steps.payload.outputs.checksum }}
          PAK_URL: ${{ steps.sync_pak.outputs.dist_pak_url }}
          PAK_CHECKSUM: ${{ steps.payload.outputs.pak_checksum }}
          RI_URL: ${{ steps.sync_recognition.outputs.ri_url }}
          RI_CHECKSUM: ${{ steps.payload.outputs.ri_checksum }}
          RE_URL: ${{ steps.sync_recognition.outputs.re_url }}
          RE_CHECKSUM: ${{ steps.payload.outputs.re_checksum }}
          RQ_URL: ${{ steps.sync_recognition.outputs.rq_url }}
          RQ_CHECKSUM: ${{ steps.payload.outputs.rq_checksum }}
          RB_URL: ${{ steps.sync_recognition.outputs.rb_url }}
          RB_CHECKSUM: ${{ steps.payload.outputs.rb_checksum }}
          FFI_URL: ${{ steps.sync_recognition.outputs.ffi_url }}
          FFI_CHECKSUM: ${{ steps.payload.outputs.ffi_checksum }}
        run: |
          set -euo pipefail
          EXTRA_METADATA="$ANDROID_MAVEN_METADATA_JSON"
          if [[ "$PLATFORM" == "ios" ]]; then
            # The payload gate above already refused a dispatch missing any of
            # these, so an empty value here is a workflow bug, not a 1.6.x
            # shape — and update_spm_manifest.py refuses to stamp on it.
            EXTRA_METADATA=$(jq -nc \
              --arg sdk_url "$SDK_URL" --arg sdk_cs "$SDK_CHECKSUM" \
              --arg pak_url "$PAK_URL" --arg pak_cs "$PAK_CHECKSUM" \
              --arg ri_url "$RI_URL" --arg ri_cs "$RI_CHECKSUM" \
              --arg re_url "$RE_URL" --arg re_cs "$RE_CHECKSUM" \
              --arg rq_url "$RQ_URL" --arg rq_cs "$RQ_CHECKSUM" \
              --arg rb_url "$RB_URL" --arg rb_cs "$RB_CHECKSUM" \
              --arg ffi_url "$FFI_URL" --arg ffi_cs "$FFI_CHECKSUM" \
              '{
                spm_targets: {
                  NeurolabsSDK:            {url: $sdk_url, checksum_sha256: $sdk_cs},
                  ProductAuditKit:         {url: $pak_url, checksum_sha256: $pak_cs},
                  RecognitionInterface:    {url: $ri_url,  checksum_sha256: $ri_cs},
                  RecognitionEngine:       {url: $re_url,  checksum_sha256: $re_cs},
                  RecognitionEngineQdrant: {url: $rq_url,  checksum_sha256: $rq_cs},
                  RecognitionBootstrap:    {url: $rb_url,  checksum_sha256: $rb_cs},
                  NLQdrantEdgeFFI:         {url: $ffi_url, checksum_sha256: $ffi_cs}
                }
              }')
          fi
          if [[ -n "$EXTRA_METADATA" ]]; then
            python3 scripts/merge_release_state.py \
              manifests/release-state \
              "${{ steps.payload.outputs.version }}" \
              "${{ steps.payload.outputs.platform }}" \
              "${{ steps.sync_asset.outputs.dist_asset_url }}" \
              "${{ steps.payload.outputs.checksum }}" \
              "$EXTRA_METADATA"
          else
            python3 scripts/merge_release_state.py \
              manifests/release-state \
              "${{ steps.payload.outputs.version }}" \
              "${{ steps.payload.outputs.platform }}" \
              "${{ steps.sync_asset.outputs.dist_asset_url }}" \
              "${{ steps.payload.outputs.checksum }}"
          fi

      # Committed on EVERY dispatch, gate or no gate. release-state is the
      # train's memory: it is how the third dispatch learns that the other two
      # already landed. Rolling it into the gated manifest commit below would
      # mean the first two platforms left no trace on `main` and the readiness
      # check could never pass. Nothing here is partner-facing — it is an
      # internal ledger, not an install instruction.
      - name: Record release state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/release-state/*.json
          git commit -m "chore(dist): record ${{ steps.payload.outputs.platform }} artifacts for ${{ steps.payload.outputs.version }}" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push

      # MOVED AHEAD OF THE STAMP/COMMIT/TAG. It used to run after the manifest
      # was already committed, pushed and the tag force-moved, so the gate it
      # is named for could not gate anything. Now `ready` is known before any
      # of that, and it is what decides whether anything partner-facing is
      # written at all.
      #
      # It runs after the state commit above so that it reads the rebased
      # ledger — whatever the other platforms pushed while this run was
      # downloading assets counts towards readiness.
      - name: Check release readiness
        id: ready
        run: |
          set +e
          python3 scripts/validate_release_ready.py "manifests/release-state/${{ steps.payload.outputs.version }}.json"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # GATED, and PLURAL, and those two facts are the same fact.
      #
      # Gated: until all three platforms have landed the release is still a
      # draft, and a draft's download URLs 404 for anyone who is not a repo
      # collaborator. Stamping on arrival replaced a working install
      # instruction with a broken one — strictly worse than leaving the
      # previous version in place.
      #
      # Plural: a dispatch only ever knew about its own platform, so gating the
      # old per-platform stamp would have meant the first two platforms skipped
      # their stamp and the third stamped only itself. The stamp therefore
      # moves to the gate and reads release-state, which by definition now
      # holds all three. Same monotonic, line-aware rules — the script imports
      # update_platform_manifest.py rather than restating them — and the same
      # all-or-nothing rule for Package.swift, whose seven binaryTargets come
      # from the iOS dispatch's spm_targets map.
      - name: Stamp every manifest for the completed release
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 scripts/stamp_manifests_from_state.py \
            "manifests/release-state/${{ steps.payload.outputs.version }}.json" \
            --manifests-dir manifests \
            --package-swift Package.swift

      # The assertion that cannot be reasoned around, unchanged and now running
      # on every completed release rather than only on iOS dispatches. Fails
      # unless every binaryTarget URL shares one /releases/download/<tag>/
      # segment, then runs `swift package dump-package` to prove the file still
      # parses and that every hand-maintained product link closure resolves.
      # There is no Swift toolchain on ubuntu-latest, so the script falls back
      # to the official Swift container; it treats "no toolchain at all" as a
      # failure, never as a skip.
      #
      # It is also the backstop for a release-state file written before
      # spm_targets existed: the stamper leaves Package.swift alone for those,
      # and this step is what proves the file is nonetheless at this tag.
      - name: Assert Package.swift serves one release line
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 scripts/verify_spm_manifest.py Package.swift \
            --expect-tag "${{ steps.payload.outputs.version }}"

      # Only the partner-facing files, and only once the release is publishable.
      # release-state was committed above, on its own, precisely so this commit
      # can be skipped without the train losing its memory.
      - name: Commit manifest changes
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift manifests/*.json
          git commit -m "chore(dist): publish manifests for ${{ steps.payload.outputs.version }}" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push

      - name: Checkout Cordova SDK repo for guide refresh
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-cordova-sdk
          path: external/neurolabs-cordova-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Checkout Android SDK repo for guide refresh
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-android-sdk
          path: external/neurolabs-android-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Checkout iOS SDK repo for guide refresh
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: neurolaboratories/neurolabs-ios-sdk
          path: external/neurolabs-ios-sdk
          token: ${{ secrets.DIST_REPO_PAT }}

      - name: Refresh integration guides
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 scripts/sync_integration_guides.py \
            --dist-root . \
            --workspace-root ./external \
            --version "${{ steps.payload.outputs.version }}"

      - name: Commit refreshed guides
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/integration-guides manifests/guides.json
          git commit -m "docs(dist): refresh integration guides for ${{ steps.payload.outputs.version }}" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push

      - name: Create or update aggregated release notes
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.payload.outputs.version }}"
          STATE_FILE="manifests/release-state/${VERSION}.json"
          IOS_URL=$(jq -r '.artifacts.ios.asset_url' "$STATE_FILE")
          ANDROID_URL=$(jq -r '.artifacts.android.asset_url' "$STATE_FILE")
          CORDOVA_URL=$(jq -r '.artifacts.cordova.asset_url' "$STATE_FILE")
          ANDROID_MAVEN_REPO=$(jq -r '.artifacts.android.maven.repository_url // empty' "$STATE_FILE")
          ANDROID_MAVEN_GROUP=$(jq -r '.artifacts.android.maven.group_id // empty' "$STATE_FILE")
          ANDROID_MAVEN_ARTIFACT=$(jq -r '.artifacts.android.maven.artifact_id // empty' "$STATE_FILE")
          ANDROID_MAVEN_VERSION=$(jq -r '.artifacts.android.maven.version // empty' "$STATE_FILE")
          ANDROID_MAVEN_PACKAGING=$(jq -r '.artifacts.android.maven.packaging // empty' "$STATE_FILE")
          ANDROID_MAVEN_NOTE=""
          if [[ -n "$ANDROID_MAVEN_REPO" && -n "$ANDROID_MAVEN_GROUP" && -n "$ANDROID_MAVEN_ARTIFACT" && -n "$ANDROID_MAVEN_VERSION" ]]; then
            ANDROID_MAVEN_NOTE=$(cat <<EOF3
          Android Gradle (Maven):
          - Repository: ${ANDROID_MAVEN_REPO}
          - Dependency: ${ANDROID_MAVEN_GROUP}:${ANDROID_MAVEN_ARTIFACT}:${ANDROID_MAVEN_VERSION}
          - Packaging: ${ANDROID_MAVEN_PACKAGING:-aar}
          EOF3
          )
          fi
          cat > release-notes.md <<EOF2
          Coordinated mobile distribution release ${VERSION}

          Assets (dist URLs):
          - iOS XCFramework: ${IOS_URL}
          - Android SDK: ${ANDROID_URL}
          - Cordova plugin: ${CORDOVA_URL}

          Partner entry points:
          - iOS SwiftPM: add this repo and select \`NeurolabsSDK\`
          - Android/Cordova: use the assets and manifests in this release

          ${ANDROID_MAVEN_NOTE}
          EOF2
          gh release edit "$VERSION" --notes-file release-notes.md

      # The tag is created ONCE, here, on the commit that carries the finished
      # manifest — and only after validate_release_ready.py said all three
      # platforms landed. No `git tag -f`, no `git push -f`: a tag partners may
      # already have resolved is never moved under them. If the tag somehow
      # exists on a different commit, that is a state a human has to look at,
      # so the job fails instead of overwriting it.
      - name: Tag and publish the release
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.payload.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          HEAD_SHA="$(git rev-parse HEAD)"
          if EXISTING="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}")"; then
            if [[ "$EXISTING" != "$HEAD_SHA" ]]; then
              echo "::error::Tag ${VERSION} already exists at ${EXISTING} but the finished" >&2
              echo "manifest is at ${HEAD_SHA}. Refusing to force-move a published tag." >&2
              echo "Delete the tag deliberately, or cut a new patch version." >&2
              exit 1
            fi
          else
            git tag -a "$VERSION" -m "Coordinated mobile distribution release $VERSION"
            git push origin "refs/tags/${VERSION}"
          fi
          # Never let a backport claim GitHub's "Latest" badge. That badge is
          # what a partner sees first, and v1.6.12 held it while being an
          # iOS-only two-asset release with no Android AAR and no Cordova tgz.
          IS_LATEST=$(VERSION="$VERSION" python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import semver
          version = os.environ["VERSION"]
          known = []
          for name in ("ios", "android", "cordova"):
              data = json.loads(open(f"manifests/{name}.json").read())
              entries = list((data.get("lines") or {}).values()) + [data.get("latest") or {}]
              known += [e["version"] for e in entries if e.get("version")]
          print("true" if all(semver.compare(version, k) >= 0 for k in known) else "false")
          PY
          )
          gh release edit "$VERSION" --draft=false --latest="$IS_LATEST"
          echo "published $VERSION (latest=$IS_LATEST)"
